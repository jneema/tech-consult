<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Corbel admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpath d='M3 4h22v6H14v14H8V10H3z' fill='%230B1220'/%3E%3Crect x='16' y='13' width='9' height='11' fill='%230E6B4E'/%3E%3C/svg%3E">
<script>try{var t=(localStorage.getItem("corbel-theme")||"").replace(/"/g,"");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

<!-- Sign in -->
<main class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <a class="brand" href="../index.html"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 4h22v6H14v14H8V10H3z" fill="currentColor"/><rect x="16" y="13" width="9" height="11" fill="var(--accent)"/></svg><span>Corbel</span></a>
    <h1>Sign in to admin</h1>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <span class="err" id="loginErr" role="alert"></span>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    <p class="muted small">The password is printed when <code>server.py</code> first starts, or set with <code>CORBEL_ADMIN_PASSWORD</code>.</p>
  </form>
</main>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="side">
    <a class="brand" href="../index.html" target="_blank" rel="noopener"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 4h22v6H14v14H8V10H3z" fill="currentColor"/><rect x="16" y="13" width="9" height="11" fill="var(--accent)"/></svg><span>Corbel</span><small>Admin</small></a>
    <nav class="side-nav" aria-label="Admin sections">
      <a href="#inbox" data-view="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-7.5h11L20 13M4 13v5.5h16V13M4 13h4.5l1.5 2.5h4l1.5-2.5H20"/></svg>Inbox<span class="count" id="newCount" hidden></span></a>
      <a href="#cases" data-view="cases"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 10h17"/></svg>Case studies</a>
      <a href="#roles" data-view="roles"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>Careers</a>
    </nav>
    <div class="side-foot">
      <a class="side-link" href="../index.html" target="_blank" rel="noopener">View site ↗</a>
      <button class="side-link" type="button" data-theme-toggle>Light / dark</button>
      <button class="side-link" type="button" id="logout">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="viewTitle">Inbox</h1>
      <button class="status" type="button" id="buildStatus" title="Show the last build log"></button>
    </header>
    <div class="view" id="view"></div>
  </div>
</div>

<dialog class="admin-dialog" id="logDialog" aria-labelledby="logTitle">
  <div class="dialog-head"><h2 id="logTitle">Last build</h2><button class="icon-btn" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <pre id="logText"></pre>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="admin.js"></script>
</body>
</html>
